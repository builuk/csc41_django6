{% extends "base.html" %}
{% block title %}Список курсів · EduHub{% endblock %}
{% block content %}
  <h1>{{ heading|default:"Курси" }}</h1>
  <ul>
    {% for course in courses %}
      <li><a href="{% url 'courses:detail' course.pk %}">{{ course.title }}</a></li>
    {% empty %}
      <li>Курсів немає.</li>
    {% endfor %}
  </ul>
{% endblock %}
